name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/validate_screenshot_manifest.py
      - run: python -m pytest tests/test_app.py tests/test_contract.py tests/test_group_config.py tests/test_database.py tests/test_settlement.py tests/test_ledger.py tests/test_review.py tests/test_late_fee.py tests/test_screenshot_dataset.py tests/test_payout.py tests/test_reminders.py tests/test_shared_fixtures.py tests/test_messages.py
      - name: Browser smoke tests
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          trap 'kill $!' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          python -m pytest tests/ui --base-url http://127.0.0.1:8000
